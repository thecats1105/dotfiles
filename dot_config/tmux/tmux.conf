# set -g default-terminal "xterm-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

set-window-option -g mode-keys vi

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open '#{pane_current_path}'"
bind -r e kill-pane -a
# Set new panes to open in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
set-option -g status-style fg="#a6adc8",bg=default
set -g window-style fg=default,bg=default
set -g window-active-style fg=default,bg=default
set-option -g history-limit 2051072
set -g allow-passthrough on
set -g renumber-windows on

set -sg escape-time 10


# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
# https://github.com/craftzdog/tmux-claude-session-manager
# set -g @plugin 'craftzdog/tmux-claude-session-manager'
# https://github.com/aaronvb/tmux-claude-codex-session-manager
set -g @plugin 'aaronvb/tmux-claude-codex-session-manager'
run '~/.tmux/plugins/tpm/tpm'

# Windows Clipboard
set -s set-clipboard off
set -s copy-command 'win32yank.exe -i --crlf'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# bind-key P run "win32yank.exe -o --lf | tmux load-buffer - && tmux paste-buffer"

# Enable mouse
set -g mouse on

# Claude Code Shift-Enter
bind-key -T root S-Enter send-keys Escape "[13;2u"

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
