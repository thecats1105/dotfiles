# Terminal overrides
# set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Basic settings
set-option -g status-justify "left"
set-window-option -g mode-keys vi

# Look'n feel (Catppuccin Mocha tone)
set-option -g status-style fg="#a6adc8",bg=default
set -g window-style fg=default,bg=default
set -g window-active-style fg=default,bg=default
set-option -g history-limit 2051072
set -g allow-passthrough on
set -g renumber-windows on

set -sg escape-time 10

# Allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# Enable mouse
set -g mouse on

# Environment forwarding
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Windows Clipboard (win32yank integration for WSL)
set -s set-clipboard off
set -s copy-command 'win32yank.exe -i --crlf'

# macOS support (if running on Darwin)
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'craftzdog/tmux-claude-hatch'

# Run TPM
if-shell "[ -f ~/.config/tmux/plugins/tpm/tpm ]" \
  "run '~/.config/tmux/plugins/tpm/tpm'" \
  "run '~/.tmux/plugins/tpm/tpm'"

# Imports
source ~/.config/tmux/bindings.conf
source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf
source -q ~/.config/tmux/tmux-private.conf
