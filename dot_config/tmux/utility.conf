# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w90% -h90% -E lazygit

# Tmux Agent Hatch
# set -g @claude_command 'ocx claude'
# set -g @codex_command 'codex'
set -g @agy_args '--dangerously-skip-permissions'
# set -g @claude_launch_key 'y'
# set -g @codex_launch_key 'o'
# set -g @agy_launch_key 'Y'
# set -g @agent_list_key 'u'
set -g @agent_sort "recent"
set -g @agent_fzf_options "\
  --prompt 'nav> ' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(kill {3})+reload(sleep 0.3; \$AGENT_PICKER --list)' \
  --bind 'i:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'a:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,i,a,x)+change-prompt(nav> )'"
