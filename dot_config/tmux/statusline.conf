# vim: ft=tmux
set -g mode-style "fg=#cdd6f4,bg=#313244"

set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

set -g status "on"
set -g status-interval 1
set -g status-justify "centre"

set -g status-style fg=#a6adc8,bg=default

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#cba6f7,bg=default]#[fg=#11111b,bg=#cba6f7,bold] #S:#I.#P #[fg=#cba6f7,bg=#45475a,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#45475a,bold] #(whoami) #[fg=#45475a,bg=default]"
set -g status-right "#[fg=#45475a,bg=default,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#45475a,bold] #h #[fg=#45475a,bg=default]"

setw -g window-status-activity-style "underscore,fg=#a6adc8,bg=default"
setw -g window-status-bell-style "default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#a6adc8,bg=default"
setw -g window-status-format '#[fg=#{?window_bell_flag,#f38ba8,#fab387},bg=default]#[fg=#11111b,bg=#{?window_bell_flag,#f38ba8,#fab387},bold]#I #[fg=#cdd6f4,bg=#313244,nobold] #{b:pane_current_path} #[fg=#313244,bg=default]'
setw -g window-status-current-format '#[fg=#{?window_bell_flag,#f38ba8,#89b4fa},bg=default]#[fg=#11111b,bg=#{?window_bell_flag,#f38ba8,#89b4fa},bold]#I #[fg=#11111b,bg=#b4befe,bold] #{b:pane_current_path} #[fg=#b4befe,bg=default]'
