# vim: ft=tmux
#### COLOUR (Catppuccin Mocha)

# active window title colors
set-window-option -g window-status-current-style fg=#fab387,bg=default,bright

# pane number display
set-option -g display-panes-active-colour "#89b4fa" # Blue
set-option -g display-panes-colour "#fab387"        # Peach

# clock
set-window-option -g clock-mode-colour "#89b4fa"    # Blue

# popup (display-popup)
set-option -g popup-style "bg=default"
set-option -g popup-border-style "fg=#f38ba8,bg=default" # Pink
set-option -g popup-border-lines rounded
