set-window-option -g mode-keys vi

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open current directory
bind o run-shell "open '#{pane_current_path}'"
bind -r e kill-pane -a

# Set new panes/windows to open in current directory
bind c new-window -c "#{pane_current_path}"

# Keep panes evenly sized when splitting
bind | split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind % split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind - split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
bind '"' split-window -v -c "#{pane_current_path}" \; select-layout even-vertical

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Windows Clipboard (WSL copy-mode)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# bind-key P run "win32yank.exe -o --lf | tmux load-buffer - && tmux paste-buffer"

# Claude Code Shift-Enter
bind-key -T root S-Enter send-keys Escape "[13;2u"
